<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Prediction System</title>
<style>
  :root {
    --sky-deep: #0b3d63;
    --sky-mid: #1e6fa8;
    --sky-light: #5aa9dc;
    --sky-pale: #eaf5ff;
    --accent-rain: #2f6f9f;
    --accent-clear: #f2a93b;
    --card-bg: #ffffff;
    --text-dark: #1c2b36;
    --text-muted: #5a6b78;
    --shadow-soft: 0 20px 45px rgba(11, 61, 99, 0.25);
    --radius-lg: 22px;
    --radius-md: 14px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: radial-gradient(circle at 20% 15%, #79c2f0 0%, transparent 45%),
                radial-gradient(circle at 85% 10%, #cdeaff 0%, transparent 40%),
                linear-gradient(160deg, var(--sky-deep) 0%, var(--sky-mid) 45%, var(--sky-light) 100%);
    background-attachment: fixed;
    color: var(--text-dark);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.5) 0, transparent 50%),
      radial-gradient(2px 2px at 80% 30%, rgba(255,255,255,0.35) 0, transparent 50%),
      radial-gradient(3px 3px at 60% 70%, rgba(255,255,255,0.25) 0, transparent 50%),
      radial-gradient(2px 2px at 30% 80%, rgba(255,255,255,0.3) 0, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 36px 32px 32px;
    animation: riseIn 0.6s ease-out;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    margin: 0 0 8px;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--sky-deep);
    letter-spacing: -0.3px;
  }

  .header p {
    margin: 0;
    font-size: 0.95rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sky-deep);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1.5px solid #d7e6f0;
    background: var(--sky-pale);
    font-size: 0.95rem;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .field input::placeholder {
    color: #9fb3c0;
  }

  .field input:focus {
    border-color: var(--sky-mid);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(30, 111, 168, 0.12);
  }

  .field input.invalid {
    border-color: #d9534f;
    box-shadow: 0 0 0 4px rgba(217, 83, 79, 0.12);
  }

  .field-error {
    color: #d9534f;
    font-size: 0.78rem;
    margin-top: 5px;
    min-height: 14px;
  }

  .predict-btn {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--sky-mid), var(--sky-deep));
    color: #ffffff;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(30, 111, 168, 0.35);
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }

  .predict-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(30, 111, 168, 0.45);
  }

  .predict-btn:active {
    transform: translateY(0);
  }

  .predict-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #ffffff;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: -2px;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .result-card {
    margin-top: 24px;
    border-radius: var(--radius-md);
    padding: 22px 20px;
    text-align: center;
    display: none;
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .result-card.show {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .result-card.rain {
    background: linear-gradient(135deg, #dfeeff, #c9e3fb);
    border: 1.5px solid #a9cff2;
  }

  .result-card.no-rain {
    background: linear-gradient(135deg, #fff6e2, #ffedc2);
    border: 1.5px solid #ffdf9c;
  }

  .result-card.error {
    background: #fdeceb;
    border: 1.5px solid #f3b6b2;
    color: #a33a34;
  }

  .result-icon {
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--sky-deep);
    margin-bottom: 4px;
  }

  .result-card.no-rain .result-label {
    color: #8a5b12;
  }

  .result-prob {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .result-error-text {
    font-size: 0.92rem;
    font-weight: 600;
    color: #a33a34;
  }

  .prob-bar-track {
    width: 100%;
    height: 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.6);
    margin-top: 12px;
    overflow: hidden;
  }

  .prob-bar-fill {
    height: 100%;
    border-radius: 6px;
    background: var(--sky-mid);
    width: 0%;
    transition: width 0.6s ease;
  }

  .result-card.no-rain .prob-bar-fill {
    background: var(--accent-clear);
  }

  footer.note {
    text-align: center;
    margin-top: 18px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.75);
  }

  @media (max-width: 420px) {
    .card {
      padding: 28px 22px 24px;
    }
    .header h1 {
      font-size: 1.45rem;
    }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="header">
      <h1>🌦️ Weather Prediction</h1>
      <p>Predict whether it will rain using Machine Learning</p>
    </div>

    <form id="weatherForm" novalidate>
      <div class="field">
        <label for="temp">Temperature (°C)</label>
        <input type="number" step="any" id="temp" placeholder="Enter temperature" />
        <div class="field-error" id="tempError"></div>
      </div>

      <div class="field">
        <label for="humidity">Humidity (%)</label>
        <input type="number" step="any" id="humidity" placeholder="Enter humidity" />
        <div class="field-error" id="humidityError"></div>
      </div>

      <div class="field">
        <label for="wind">Wind Speed</label>
        <input type="number" step="any" id="wind" placeholder="Enter wind speed" />
        <div class="field-error" id="windError"></div>
      </div>

      <div class="field">
        <label for="pressure">Pressure (hPa)</label>
        <input type="number" step="any" id="pressure" placeholder="Enter pressure" />
        <div class="field-error" id="pressureError"></div>
      </div>

      <button type="submit" class="predict-btn" id="predictBtn">Predict Weather</button>
    </form>

    <div class="result-card" id="resultCard">
      <div id="resultContent"></div>
    </div>
  </div>

  <footer class="note">Weather Prediction System · ML-powered forecast demo</footer>
</div>

<script>
  const form = document.getElementById('weatherForm');
  const predictBtn = document.getElementById('predictBtn');
  const resultCard = document.getElementById('resultCard');
  const resultContent = document.getElementById('resultContent');

  const fields = [
    { id: 'temp', errorId: 'tempError', label: 'Temperature' },
    { id: 'humidity', errorId: 'humidityError', label: 'Humidity' },
    { id: 'wind', errorId: 'windError', label: 'Wind speed' },
    { id: 'pressure', errorId: 'pressureError', label: 'Pressure' }
  ];

  function clearErrors() {
    fields.forEach(f => {
      document.getElementById(f.id).classList.remove('invalid');
      document.getElementById(f.errorId).textContent = '';
    });
  }

  function validate() {
    let isValid = true;
    fields.forEach(f => {
      const input = document.getElementById(f.id);
      const errorEl = document.getElementById(f.errorId);
      const value = input.value.trim();

      if (value === '') {
        input.classList.add('invalid');
        errorEl.textContent = `${f.label} is required.`;
        isValid = false;
      } else if (isNaN(Number(value))) {
        input.classList.add('invalid');
        errorEl.textContent = `${f.label} must be a number.`;
        isValid = false;
      } else {
        input.classList.remove('invalid');
        errorEl.textContent = '';
      }
    });
    return isValid;
  }

  function showResult(html, cardClass) {
    resultCard.className = 'result-card show ' + cardClass;
    resultContent.innerHTML = html;
  }

  function setLoading(loading) {
    predictBtn.disabled = loading;
    predictBtn.innerHTML = loading
      ? '<span class="spinner"></span>Predicting...'
      : 'Predict Weather';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    resultCard.classList.remove('show');

    if (!validate()) {
      return;
    }

    const payload = {
      temp: Number(document.getElementById('temp').value),
      humidity: Number(document.getElementById('humidity').value),
      wind: Number(document.getElementById('wind').value),
      pressure: Number(document.getElementById('pressure').value)
    };

    setLoading(true);

    try {
      const response = await fetch('http://127.0.0.1:8000/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('Server responded with an error.');
      }

      const data = await response.json();
      const prediction = data.prediction;
      const probability = data.probability;
      const probPercent = (probability * 100).toFixed(2);

      if (prediction === 'Rain') {
        showResult(`
          <div class="result-icon">🌧️</div>
          <div class="result-label">Rain</div>
          <div class="result-prob">Probability: ${probPercent}%</div>
          <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${probPercent}%"></div></div>
        `, 'rain');
      } else {
        showResult(`
          <div class="result-icon">☀️</div>
          <div class="result-label">No Rain</div>
          <div class="result-prob">Probability: ${probPercent}%</div>
          <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${probPercent}%"></div></div>
        `, 'no-rain');
      }
    } catch (err) {
      showResult(`
        <div class="result-icon">⚠️</div>
        <div class="result-error-text">Unable to connect to R prediction server.</div>
      `, 'error');
    } finally {
      setLoading(false);
    }
  });
</script>

</body>
</html>
