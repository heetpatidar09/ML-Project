<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather Prediction</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #f0f9ff,
                    #e0f2fe
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .container {

            width: 100%;

            max-width: 900px;
        }


        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .header .icon {

            font-size: 60px;

            margin-bottom: 10px;
        }


        .header h1 {

            font-size: 38px;

            color: #0f172a;

            margin-bottom: 8px;
        }


        .header p {

            color: #64748b;

            font-size: 16px;
        }


        .card {

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.12);
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group label {

            font-weight: 600;

            color: #334155;

            margin-bottom: 8px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-wrapper input {

            width: 100%;

            padding: 15px;

            border:
                2px solid #e2e8f0;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }


        .input-wrapper input:focus {

            border-color: #0284c7;

            box-shadow:
                0 0 0 4px
                rgba(2, 132, 199, 0.1);
        }


        .unit {

            position: absolute;

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

            font-size: 14px;
        }


        .predict-btn {

            width: 100%;

            margin-top: 28px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #0369a1
                );

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .predict-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(2, 132, 199, 0.25);
        }


        .predict-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        .result {

            margin-top: 25px;

            padding: 25px;

            border-radius: 16px;

            display: none;

            text-align: center;
        }


        .result.show {

            display: block;
        }


        .result.rain {

            display: block;

            background: #eff6ff;

            border:
                1px solid #bfdbfe;
        }


        .result.no-rain {

            display: block;

            background: #fefce8;

            border:
                1px solid #fde68a;
        }


        .result.error {

            display: block;

            background: #fef2f2;

            border:
                1px solid #fecaca;
        }


        .result-icon {

            font-size: 48px;

            margin-bottom: 10px;
        }


        .result-title {

            font-size: 25px;

            font-weight: 700;

            color: #0f172a;

            margin-bottom: 10px;
        }


        .probability {

            font-size: 16px;

            color: #475569;

            margin-bottom: 12px;
        }


        .progress {

            width: 100%;

            height: 12px;

            background: #e2e8f0;

            border-radius: 20px;

            overflow: hidden;
        }


        .progress-bar {

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #0284c7
                );

            border-radius: 20px;

            transition:
                width 0.6s ease;
        }


        .error-message {

            color: #b91c1c;

            font-weight: 600;

            line-height: 1.5;
        }


        .spinner {

            display: inline-block;

            width: 18px;

            height: 18px;

            border:
                3px solid
                rgba(255,255,255,0.4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 8px;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        .footer {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-top: 18px;
        }


        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="header">

            <div class="icon">🌦️</div>

            <h1>Weather Prediction</h1>

            <p>
                Predict whether rain is expected
                using machine learning
            </p>

        </div>


        <div class="card">


            <form id="weatherForm">


                <div class="form-grid">


                    <!-- Temperature -->

                    <div class="form-group">

                        <label for="temp">
                            Temperature
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="temp"
                                placeholder="e.g. 26"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                °C
                            </span>

                        </div>

                    </div>


                    <!-- Humidity -->

                    <div class="form-group">

                        <label for="humidity">
                            Humidity
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="humidity"
                                placeholder="e.g. 82"
                                min="0"
                                max="100"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                %
                            </span>

                        </div>

                    </div>


                    <!-- Wind -->

                    <div class="form-group">

                        <label for="wind">
                            Wind Speed
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="wind"
                                placeholder="e.g. 9"
                                min="0"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                km/h
                            </span>

                        </div>

                    </div>


                    <!-- Pressure -->

                    <div class="form-group">

                        <label for="pressure">
                            Atmospheric Pressure
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="pressure"
                                placeholder="e.g. 1011"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                hPa
                            </span>

                        </div>

                    </div>


                </div>


                <button
                    type="submit"
                    class="predict-btn"
                    id="predictBtn"
                >
                    Predict Weather
                </button>


            </form>


            <!-- Result -->

            <div
                id="result"
                class="result"
            ></div>


        </div>


        <div class="footer">

            R Logistic Regression •
            Python Flask •
            HTML/CSS/JavaScript

        </div>


    </div>


    <script>

        const form =
            document.getElementById(
                "weatherForm"
            );

        const predictBtn =
            document.getElementById(
                "predictBtn"
            );

        const result =
            document.getElementById(
                "result"
            );


        // ====================================================
        // VALIDATION
        // ====================================================

        function validateForm() {

            const temp =
                Number(
                    document.getElementById(
                        "temp"
                    ).value
                );

            const humidity =
                Number(
                    document.getElementById(
                        "humidity"
                    ).value
                );

            const wind =
                Number(
                    document.getElementById(
                        "wind"
                    ).value
                );

            const pressure =
                Number(
                    document.getElementById(
                        "pressure"
                    ).value
                );


            if (!Number.isFinite(temp)) {

                showError(
                    "Please enter a valid temperature."
                );

                return false;
            }


            if (
                !Number.isFinite(humidity) ||
                humidity < 0 ||
                humidity > 100
            ) {

                showError(
                    "Humidity must be between 0% and 100%."
                );

                return false;
            }


            if (
                !Number.isFinite(wind) ||
                wind < 0
            ) {

                showError(
                    "Please enter a valid wind speed."
                );

                return false;
            }


            if (!Number.isFinite(pressure)) {

                showError(
                    "Please enter a valid pressure."
                );

                return false;
            }


            return true;
        }


        // ====================================================
        // SHOW RESULT
        // ====================================================

        function showResult(
            type,
            icon,
            title,
            probability
        ) {

            const percent =
                (
                    probability * 100
                ).toFixed(2);


            result.className =
                `result ${type}`;


            result.innerHTML = `

                <div class="result-icon">
                    ${icon}
                </div>

                <div class="result-title">
                    ${title}
                </div>

                <div class="probability">
                    Rain probability:
                    <strong>${percent}%</strong>
                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width: ${percent}%"
                    ></div>

                </div>

            `;
        }


        // ====================================================
        // SHOW ERROR
        // ====================================================

        function showError(message) {

            result.className =
                "result error";


            result.innerHTML = `

                <div class="result-icon">
                    ⚠️
                </div>

                <div class="error-message">
                    ${message}
                </div>

            `;
        }


        // ====================================================
        // FORM SUBMIT
        // ====================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!validateForm()) {
                    return;
                }


                const payload = {

                    temp: Number(
                        document.getElementById(
                            "temp"
                        ).value
                    ),

                    humidity: Number(
                        document.getElementById(
                            "humidity"
                        ).value
                    ),

                    wind: Number(
                        document.getElementById(
                            "wind"
                        ).value
                    ),

                    pressure: Number(
                        document.getElementById(
                            "pressure"
                        ).value
                    )

                };


                // Loading state

                predictBtn.disabled = true;

                predictBtn.innerHTML = `
                    <span class="spinner"></span>
                    Predicting...
                `;


                result.className =
                    "result";


                result.innerHTML = "";


                try {

                    const response =
                        await fetch(
                            "http://127.0.0.1:5000/predict",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            data.details ||
                            "Prediction failed."
                        );
                    }


                    if (
                        data.prediction ===
                        "Rain"
                    ) {

                        showResult(
                            "rain",
                            "🌧️",
                            "Rain Expected",
                            data.probability
                        );

                    } else {

                        showResult(
                            "no-rain",
                            "☀️",
                            "No Rain Expected",
                            data.probability
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showError(
                        error.message ||
                        "Unable to connect to Flask server."
                    );

                } finally {

                    predictBtn.disabled =
                        false;

                    predictBtn.innerHTML =
                        "Predict Weather";

                }

            }
        );

    </script>


</body>

</html>
