<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Health Risk Prediction</title>


    <style>

        :root {
            --bg-start: #f0fdf4;
            --bg-mid: #ecfeff;
            --bg-end: #eef2ff;
            --card-bg: rgba(255, 255, 255, 0.82);
            --surface: #ffffff;
            --primary: #0ea5e9;
            --primary-dark: #0369a1;
            --secondary: #14b8a6;
            --accent: #8b5cf6;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbeafe;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --warning-bg: #fff7ed;
            --warning-border: #fed7aa;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --shadow: 0 22px 55px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(20, 184, 166, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.18), transparent 26%),
                linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 980px;
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .header .icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 92px;
            height: 92px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.14), rgba(139, 92, 246, 0.14));
            box-shadow: 0 18px 38px rgba(14, 165, 233, 0.12);
            font-size: 42px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
        }

        .header h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            color: var(--text);
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        .header p {
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.7;
            max-width: 640px;
            margin: 0 auto;
        }

        .header-badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .badge {
            border-radius: 999px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(20, 184, 166, 0.2);
            color: #0f766e;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            color: #1e293b;
            font-size: 0.96rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 15px 48px 15px 16px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
        }

        .input-wrapper select {
            appearance: none;
            padding-right: 42px;
            cursor: pointer;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        .unit {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .predict-btn {
            width: 100%;
            margin-top: 26px;
            padding: 17px 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-size: 1.04rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 16px 28px rgba(91, 33, 182, 0.22);
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(2, 105, 161, 0.28);
            filter: brightness(1.02);
        }

        .predict-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            margin-top: 26px;
            padding: 24px 20px;
            border-radius: 18px;
            display: none;
            text-align: center;
            border: 1px solid transparent;
        }

        .result.show {
            display: block;
        }

        .result.rain {
            display: block;
            background: linear-gradient(135deg, rgba(255, 247, 237, 0.95), rgba(255, 255, 255, 0.9));
            border-color: var(--warning-border);
        }

        .result.no-rain {
            display: block;
            background: linear-gradient(135deg, rgba(236, 253, 245, 0.96), rgba(255, 255, 255, 0.9));
            border-color: var(--success-border);
        }

        .result.error {
            display: block;
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: clamp(1.35rem, 2vw, 1.9rem);
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }

        .probability {
            font-size: 1rem;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: rgba(148, 163, 184, 0.25);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9, #2563eb);
            border-radius: 999px;
            transition: width 0.6s ease;
        }

        .error-message {
            color: #b91c1c;
            font-weight: 700;
            line-height: 1.6;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.38);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 18px;
            letter-spacing: 0.02em;
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
            }

            .header {
                margin-bottom: 22px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .result {
                padding: 22px 16px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="header">

            <div class="icon">🩺</div>

            <h1>Customer Health Risk Prediction</h1>

            <p>
                Predict whether a customer is at
                high health risk using machine learning
            </p>

            <div class="header-badges">
                <span class="badge">AI Powered</span>
                <span class="badge">4 Models</span>
                <span class="badge">Health Analytics</span>
            </div>

        </div>


        <div class="card">


            <form id="customerForm">


                <div class="form-grid">


                    <!-- Age -->

                    <div class="form-group">

                        <label for="age">
                            Customer Age
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="age"
                                placeholder="e.g. 34"
                                min="18"
                                step="1"
                                required
                            >

                            <span class="unit">
                                yrs
                            </span>

                        </div>

                    </div>


                    <!-- BMI -->

                    <div class="form-group">

                        <label for="bmi">
                            BMI
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="bmi"
                                placeholder="e.g. 27.5"
                                min="0"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                BMI
                            </span>

                        </div>

                    </div>


                    <!-- Blood Pressure -->

                    <div class="form-group">

                        <label for="blood_pressure">
                            Blood Pressure
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="blood_pressure"
                                placeholder="e.g. 128"
                                min="0"
                                step="1"
                                required
                            >

                            <span class="unit">
                                mmHg
                            </span>

                        </div>

                    </div>


                    <!-- Exercise Hours -->

                    <div class="form-group">

                        <label for="exercise_hours">
                            Exercise Hours / Week
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="number"
                                id="exercise_hours"
                                placeholder="e.g. 3"
                                min="0"
                                step="0.1"
                                required
                            >

                            <span class="unit">
                                hrs
                            </span>

                        </div>

                    </div>


                </div>


                <div class="form-group" style="grid-column: 1 / -1;">

                    <label for="modelType">
                        Prediction Model
                    </label>

                    <div class="input-wrapper">

                        <select
                            id="modelType"
                        >
                            <option value="logistic">Linear Regression</option>
                            <option value="decision_tree">Decision Tree</option>
                            <option value="random_forest">Random Forest</option>
                            <option value="svm">KNN</option>
                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="predict-btn"
                    id="predictBtn"
                >
                    Predict Health Risk
                </button>


            </form>


            <!-- Result -->

            <div
                id="result"
                class="result"
            ></div>


        </div>


        <div class="footer">

            Customer Health •
            R Models •
            Python Flask •
            HTML/CSS/JavaScript

        </div>


    </div>


    <script>

        const form =
            document.getElementById(
                "customerForm"
            );

        const predictBtn =
            document.getElementById(
                "predictBtn"
            );

        const modelType =
            document.getElementById(
                "modelType"
            );

        const result =
            document.getElementById(
                "result"
            );


        // ====================================================
        // VALIDATION
        // ====================================================

        function validateForm() {

            const age =
                Number(
                    document.getElementById(
                        "age"
                    ).value
                );

            const bmi =
                Number(
                    document.getElementById(
                        "bmi"
                    ).value
                );

            const bloodPressure =
                Number(
                    document.getElementById(
                        "blood_pressure"
                    ).value
                );

            const exerciseHours =
                Number(
                    document.getElementById(
                        "exercise_hours"
                    ).value
                );


            if (!Number.isFinite(age) || age < 18) {

                showError(
                    "Please enter a valid customer age above 18."
                );

                return false;
            }


            if (
                !Number.isFinite(bmi) ||
                bmi <= 0
            ) {

                showError(
                    "Please enter a valid BMI value."
                );

                return false;
            }


            if (
                !Number.isFinite(bloodPressure) ||
                bloodPressure <= 0
            ) {

                showError(
                    "Please enter a valid blood pressure value."
                );

                return false;
            }


            if (!Number.isFinite(exerciseHours) || exerciseHours < 0) {

                showError(
                    "Please enter a valid exercise-hours value."
                );

                return false;
            }


            return true;
        }


        // ====================================================
        // SHOW RESULT
        // ====================================================

        function showResult(
            type,
            icon,
            title,
            probability
        ) {

            const percent =
                (
                    probability * 100
                ).toFixed(2);


            result.className =
                `result ${type}`;


            result.innerHTML = `

                <div class="result-icon">
                    ${icon}
                </div>

                <div class="result-title">
                    ${title}
                </div>

                <div class="probability">
                    Health risk probability:
                    <strong>${percent}%</strong>
                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width: ${percent}%"
                    ></div>

                </div>

            `;
        }


        // ====================================================
        // SHOW ERROR
        // ====================================================

        function showError(message) {

            result.className =
                "result error";


            result.innerHTML = `

                <div class="result-icon">
                    ⚠️
                </div>

                <div class="error-message">
                    ${message}
                </div>

            `;
        }


        // ====================================================
        // FORM SUBMIT
        // ====================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!validateForm()) {
                    return;
                }


                const payload = {

                    age: Number(
                        document.getElementById(
                            "age"
                        ).value
                    ),

                    bmi: Number(
                        document.getElementById(
                            "bmi"
                        ).value
                    ),

                    blood_pressure: Number(
                        document.getElementById(
                            "blood_pressure"
                        ).value
                    ),

                    exercise_hours: Number(
                        document.getElementById(
                            "exercise_hours"
                        ).value
                    ),

                    model: modelType.value

                };


                // Loading state

                predictBtn.disabled = true;

                predictBtn.innerHTML = `
                    <span class="spinner"></span>
                    Predicting...
                `;


                result.className =
                    "result";


                result.innerHTML = "";


                try {

                    const response =
                        await fetch(
                            "http://127.0.0.1:5000/predict",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            data.details ||
                            "Prediction failed."
                        );
                    }


                    if (
                        data.prediction ===
                        "High Risk"
                    ) {

                        showResult(
                            "rain",
                            "⚠️",
                            "High Health Risk Detected",
                            data.probability
                        );

                    } else {

                        showResult(
                            "no-rain",
                            "✅",
                            "Low Health Risk",
                            data.probability
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showError(
                        error.message ||
                        "Unable to connect to Flask server."
                    );

                } finally {

                    predictBtn.disabled =
                        false;

                    predictBtn.innerHTML =
                        "Predict Health Risk";

                }

            }
        );

    </script>


</body>

</html>
